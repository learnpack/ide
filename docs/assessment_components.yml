version: "1.0.0"
components:
  - name: open_text_question
    description: >-
      The open text question is a type of interactive question where users can write down a text answer. The component consists in a markdown code block with the language set to `question` and has a metadata property eval in the metadata section of the code block with instructions on how to evaluate the answer. Inside the code block, you must write down 3-5 example answers with CORRECT: or INCORRECT: prefix. The question must be written before the code block, because the learner sees neither the eval nor the example answers. It must include everything needed to answer: the situation or the text to work on.
    avoid:
      - multiple choice
      - true/false
      - fill in the blank
      - this component is intended only for free form answers
      - never use for visual questions
    goodFor:
      - explaining a concept in the learner's own words
      - applying a concept by producing a short text
      - writing or rewriting a short piece, such as a prompt, a reply or a paraphrase
      - justifying a decision against clear criteria
    props:
      - eval: string (required)
    example: |
      ### In your own words, what is a variable expense?

      ```question eval="The answer must explain, in the learner's own words, that a variable expense changes from month to month"
      CORRECT: It is money you spend that is not the same every month, like groceries.
      CORRECT: An expense whose amount changes depending on what you use or buy.
      INCORRECT: It is a payment that stays the same every month.
      ```

      --- Second Example ---

      ### Write a prompt asking an AI assistant to summarize a customer's complaint email in three bullet points for your supervisor.

      ```question eval="The prompt must state the task, the text to work on, the three bullet point format and the supervisor as the audience"
      CORRECT: Summarize the customer complaint email below in three bullet points for my supervisor, covering the problem and what the customer asks for.
      CORRECT: I need to brief my supervisor. Read this complaint email and write a summary of three bullet points.
      INCORRECT: Summarize this.
      INCORRECT: Write something about customer complaints.
      ```
    rules:
      - MUST only require a textual answer that can be evaluated without images.
      - MUST NOT ask the learner to draw, sketch, diagram, circle, shade, underline, point, annotate, mark on paper, or `visualize and show`
      - MUST NOT include phrases such as `draw…`, `sketch…`, `diagram…`, `divide the shape and show…`, `mark the figure…`.
      - If the task is visual, convert to an explanatory `image` component or a numeric/text question (`select_the_blank`, `multiple_choice_question`) instead.
      - Answers can be as short as 1 word or as long as a full paragraph.
      - Only use for textual easy to evaluate questions
      - Never use this component for reflection questions, only for knowledge assessment questions.
      - Every CORRECT example must meet the eval.

  - name: multiple_choice_question
    intendedUse:
      - evaluation
      - knowledge assessment
    measures:
      - rubric: content_mastery
        weight: 0.55
      - rubric: critical_thinking
        weight: 0.25
      - rubric: application_problem_solving
        weight: 0.20
    description: >-
      Quizzes or multiple choice questions are a great way to test the knowledge of the user. They are a great way to make the user think and to make the lesson more interactive. In LearnPack, the quizzes are rendered from task list syntax.

      ### Rules

      1. Each group of options should have a question that is a list item, numbered or not, separated by an empty line from the options.
      2. Each group of options must have an unique correct answer marked with [x]
      3. Each option should be a checkbox (task list item) indented by 3 to 6 spaces, this is important for the parsing from markdown to HTML.
      4. It must be an empty line between the question and the answers options. This is important for the parsing from markdown to HTML.
      5. Ignoring any rule from the above list will break the parsing from markdown to HTML and the quiz will not be rendered correctly.

    rules:
      - Avoid questions with multiple correct answers. Each question must have an unique correct answer.
      - Avoid questions with too many options. Each question should have between 3 and 5 options.
      - The question text must not contain the correct answer or repeat an option.
      - Incorrect options must be plausible and as specific as the correct one.
      - The question always goes in the numbered line, never in the heading above it. A heading is optional and is only a short title.
    goodFor:
      - recall
      - judging a situation
    
    example: |
      ### Put your knowledge to the test!

      1. Which expense is variable?

         - [ ] Monthly rent
         - [x] Groceries
         - [ ] Phone plan

      2. What should you list first when building a budget?

         - [ ] Your savings goal
         - [ ] Your largest expense
         - [x] Your monthly income

  - name: select_the_blank
    measures:
      - rubric: content_mastery
        weight: 0.70
      - rubric: communication
        weight: 0.15
      - rubric: application_problem_solving
        weight: 0.15
    description: >-
      Use it to complete sentences with key terms or categories of a few words. It is not for whole sentences or explanations: use open_text_question for those. A select the blank is a component where the user completes a sentence by choosing the correct option from a dropdown for each blank, instead of typing free text. Because the user picks from a predefined list, grading is fully deterministic: the user can never fail due to typos, punctuation, casing or incomplete answers, and the available options give the learner guidance. It consists in a markdown code block with the language set to `select_the_blank`. Inside the code block, you must write the question with the blank (or blanks) to be filled. Each blank consists in _1_, _2_, _3_, etc. In the metadata section, for each blank you must provide the list of options separated by the pipe character `|`. IMPORTANT: the FIRST option of each blank is the correct one. You MUST provide at least 3 options per blank: 1 correct answer and at least 2 plausible distractors. You can also use select the blank for numerical questions.
    rules:
      - The FIRST option of each blank is always the correct answer; the rest are distractors.
      - Each blank MUST have at least 3 options (1 correct + at least 2 distractors).
      - Options are separated by the pipe character `|`, NOT by commas (commas can be part of an option's text).
      - Distractors must be plausible and related to the topic, never obviously wrong.
      - Each option is a term or short phrase of at most four words, never a whole sentence.
      - The sentences go inside the code block and must be understandable on their own.
      - Every number in the metadata must appear in the text as _1_, _2_, etc.; a block without blanks renders nothing.
      - Use at least 3 blanks in total: with fewer, the exercise is too easy.
      - READ-BACK CHECK - When the correct option is inserted into its blank, the WHOLE sentence MUST be grammatically correct and factually true. Re-read each completed sentence to verify before finalizing.
      - UNIQUENESS - Each blank must have exactly ONE correct option given the surrounding text, and that text must contain enough information to identify it unambiguously. NEVER write two blanks whose surrounding text is identical or interchangeable (e.g. the same description reused for two different answers).
      - DISTRACTORS MUST BE WRONG IN CONTEXT - Each distractor, if placed in the blank, MUST make the sentence false or wrong in that specific context. If a distractor would also be a valid answer, the sentence is missing disambiguating information; add it.
      - CONSISTENT FRAMING - What the learner selects (the blank) must be exactly what the instruction asks them to identify. Do not place the blank where a different part of speech belongs (e.g. asking to pick a method but leaving the blank where a position noun like "end"/"beginning" should go).
    goodFor:
      - recalling key terms
      - classifying something into categories
      - completing a definition or a rule
      - numerical answers
    avoid:
      - free text answers (use open_text_question for those)
      - blanks with fewer than 3 options
      - never use for visual questions
      - blanks where two or more options would be equally valid given the surrounding text
      - sentences that read incorrectly once the correct option is inserted
    example: |
      ### Complete the sentences

      ```select_the_blank 1="fixed|variable|annual" 2="variable|fixed|annual" 3="income|expense|saving" 4="budget|receipt|invoice"
      Rent is a _1_ expense, while groceries are a _2_ expense.
      A monthly salary counts as _3_.
      A plan for how money will be used in a month is called a _4_.
      ```

      --- Second Example ---

      ### Are you really learning? Let's check it!

      ```select_the_blank 1="401 Unauthorized|403 Forbidden|404 Not Found" 2="GET|POST|DELETE" 3="POST|GET|PUT"
      If the user is not authenticated, the server responds with _1_.
      To retrieve a resource you use _2_, and to create a new one you use _3_.
      ```

      --- Third Example (note how every sentence is unambiguous and reads correctly once filled) ---

      ### Match each array method to what it does!

      ```select_the_blank 1="push|pop|unshift" 2="pop|push|shift" 3="shift|unshift|pop" 4="unshift|shift|push"
      Pick the array method that matches each description:

      1. _1_ adds one or more elements to the end of the array.
      2. _2_ removes the last element of the array and returns it.
      3. _3_ removes the first element of the array and returns it.
      4. _4_ adds one or more elements to the beginning of the array.
      ```

  - name: ordering
    measures:
      - rubric: content_mastery
        weight: 0.60
      - rubric: application_problem_solving
        weight: 0.25
      - rubric: critical_thinking
        weight: 0.15
    description: >-
      An ordering component asks the user to arrange a set of items into the correct sequence. It is ideal for processes, step-by-step procedures or chronological events (for example: the lifecycle of an HTTP request, the steps of a git workflow, the steps of an installation process, the steps of returning a purchase, etc). Grading is fully deterministic: the user's order is compared position by position with the correct one. It consists in a markdown code block with the language set to `ordering`. Inside the code block, write one item per line, IN THE CORRECT ORDER (the renderer shuffles them before showing them to the user, and the user reorders them with up/down arrows). You can optionally add a `title` in the metadata to describe what must be ordered.
    rules:
      - Write the items in the CORRECT order inside the code block; the renderer shuffles them automatically.
      - Write exactly one item per line. Items may optionally start with a number or a list marker (it is stripped automatically).
      - Use between 3 and 6 items; fewer than 3 makes the exercise trivial, more than 6 becomes tedious.
      - There must be a single, unambiguous correct order: swapping any two items must make the sequence wrong. Do not use it when several orders could be valid.
      - Keep each item short and self-contained.
      - Use it only for a sequence the lesson teaches as steps, never for categories, priorities, opinions or tips.
      - No item may reveal its position.
    goodFor:
      - the steps of a procedure
      - the stages of a process
      - events in time
    avoid:
      - sets where more than one order is acceptable
      - actions or attitudes that happen at the same time
      - lists of tips, qualities or good practices, even if the lesson names them one after another
      - fewer than 3 items
      - never use for visual questions
    example: |
      ### Let's order the process!

      ```ordering title="Order the lifecycle of an HTTP request"
      The client opens a TCP connection
      The client sends the request
      The server processes the request and responds
      The connection is closed
      ```

      --- Second Example ---

      ### Don't lose that awesome feature you created!

      ```ordering title="Order the commands to save your changes in git"
      git add .
      git commit -m "Save changes"
      git push
      ```

      --- Third Example ---

      ### Let's get your money back!

      ```ordering title="Order the steps to return an online purchase"
      Request the return on the website
      Pack the item
      Drop the box at the pickup point
      Check that the refund arrived
      ```

  - name: code_challenge_proposal
    intendedUse:
      - hands-on learning
      - code experimentation
      - this will render an acceptable component for the teacher, so the teacher can generate a coding challenge for the student
      - The student will see all the files from the lessons
      - So you need to suggest as many files as needed for the exercise inside the code challenge proposal code block.
    description: >-
      A code file proposal is a component the teacher will use to generate some coding files used to solve an exercise in the instructions, it consists in a markdown code block with the language set to `code_challenge_proposal`. Inside the code block, you must explain what the student needs to do in the exercise in at most 20 sentences. You need to explain the files that will be generated and the instructions for the student to complete the exercise. Use this component ALL the TIME that the lesson is of type code or requires a code editor.
    rules:
      - The main file must be always be named app.extension, where extension is the extension of the file, for example, app.js, app.html, app.css, etc.
      - Keep challenges simple and easy to understand for the student, it must be related to the lesson content and the exercise instructions.
    goodFor:
      - practicing a programming concept by writing code
      - tasks that need a code editor
    avoid:
      - complex code that might not be inferred correctly by an AI model
    example: |
      ```code_challenge_proposal 
      In this exercise, the student needs to complete a function "multiply" that multiplies two numbers and print the result to the console. This exercise required an app.js where the student will write the code to complete the function. The app.js will contain a skeleton of the function to be completed.
      ```

      ```code_challenge_proposal
      In this exercise, the student needs to create a simple index.html page with a title and a paragraph. This page is linked to the app.css file with basic styling. The HTML files contains a heading but is missing the paragraph. The styles contain the rules for two id: #title and #paragraph, but the student needs to add the ids to the correct elements in the HTML file.
      ```
